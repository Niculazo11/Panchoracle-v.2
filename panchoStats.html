<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pancho Stats</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="relative min-h-screen overflow-hidden bg-[#c9a187]">

    <div class="absolute inset-0 bg-[url('./images/fondoS.jpeg')] bg-cover bg-center bg-no-repeat"></div>

    <main class="relative z-10 min-h-screen p-8">

        <h1 class="text-4xl font-bold uppercase text-black">
            Pancho Stats
        </h1>

        <div class="mt-10 w-[300px]">

            <section class="mb-6">
                <h2 class="mb-2 text-xl font-bold">
                    Tareas por completar: 2
                </h2>

                <div class="h-5 overflow-hidden rounded-full border border-black bg-[#b9d9f0]">
                    <div class="h-full w-[40%] rounded-full bg-[#5654e8]"></div>
                </div>
            </section>

            <section class="mb-6">
                <h2 class="mb-2 text-xl font-bold">
                    Hambre
                </h2>

                <div class="flex h-7 items-center justify-center rounded-full border border-black bg-[#b9d9f0] text-xs font-bold">
                    30
                </div>
            </section>

            <section class="mb-6">
                <h2 class="mb-2 text-xl font-bold">
                    Tareas completadas
                </h2>

                <div class="flex h-7 items-center justify-center rounded-full border border-black bg-[#b9d9f0] text-xs font-bold">
                    999
                </div>
            </section>

            <section>
                <h2 class="mb-2 text-xl font-bold">
                    Monedas actuales
                </h2>

                <div class="flex h-7 items-center justify-center rounded-full border border-black bg-[#b9d9f0] text-xs font-bold">
                    100
                </div>
            </section>

        </div>

        <button class="absolute bottom-8 left-8 flex h-12 w-12 items-center justify-center rounded-full border-2 border-black bg-[#b9d9f0] text-2xl transition hover:scale-110">
            ➜
        </button>

    </main>

</body>

</html>
